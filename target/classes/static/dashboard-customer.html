    <script>
        // Haversine formula to calculate distance between two points
        function haversine(lat1, lon1, lat2, lon2) {
            const R = 6371000; // Earth's radius in meters
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c; // Distance in meters
        }
    </script>

                    <output>1000</output>
                </div>
                <button onclick="findWorkers()" class="btn btn-primary"><i class="fas fa-filter"></i> Apply Filters</button>
                <button onclick="resetFilters()" class="btn btn-secondary"><i class="fas fa-undo"></i> Reset Filters</button>
            </div>

    <div class="section">
        <h3><i class="fas fa-clipboard-list"></i> My Service Requests</h3>
        <div id="requestList" class="request-list"></div>

            <input type="number" id="score" min="1" max="5" value="5">

            <label>Your Review:</label>
            <textarea id="comment" rows="3" style="width:100%;padding:8px;"></textarea>
        </div>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px;">
            <button onclick="document.getElementById('ratingForm').style.display='none';document.getElementById('backdrop').style.display='none';" class="btn btn-secondary">Cancel</button>

        <script src="js/auth-check.js"></script>
    <script>
        document.getElementById('logout').addEventListener('click', () => logout());
        let map;
        let currentRequestId, currentWorkerId;
        function resetFilters() {
            document.getElementById('workerType').value = '';
            document.getElementById('maxDistance').value = 10000;
            document.getElementById('maxCharge').value = 1000;
            document.getElementById('maxDistance').nextElementSibling.value = 10000;
            document.getElementById('maxCharge').nextElementSibling.value = 1000;
            findWorkers();
        }

        // Create custom icons for markers
        const locationMarker = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34]
        });

        const workerMarker = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34]
        });

        async function initMaps() {
            try {
                // Start with a default location (Madurai)
                const defaultLat = 9.9252;
                const defaultLng = 78.1198;
                
                // Initialize map with default view
                map = L.map('map').setView([defaultLat, defaultLng], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                
                // Show loading state
                document.getElementById('workerList').innerHTML = '<div class="loading">Getting your location...</div>';

                try {
                    // Get current location with a promise
                    const position = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, {
                            enableHighAccuracy: true,
                            timeout: 5000,
                            maximumAge: 0
                        });
                    });

                    const {latitude, longitude} = position.coords;
                    console.log('Got user location:', latitude, longitude);
                    
                    // Set map to current location with smooth animation
                    map.setView([latitude, longitude], 14, { animate: true });
                    
                    // Store coordinates for later use
                    window.userLocation = { lat: latitude, lng: longitude };
                    
                    // Add a marker for current location with custom icon
                    L.marker([latitude, longitude], {
                        icon: locationMarker,
                        title: 'Your Location'
                    })
                    .addTo(map)
                    .bindPopup('Your Location')
                    .openPopup();
                        
                    // Load workers near this location
                    await findWorkers(latitude, longitude);
                    
                } catch (locationError) {
                    console.warn('Could not get location:', locationError);
                    // Use default location (Madurai)
                    window.userLocation = { lat: defaultLat, lng: defaultLng };
                    
                    // Add a marker for default location
                    L.marker([defaultLat, defaultLng], {
                        icon: locationMarker,
                        title: 'Default Location (Madurai)'
                    })
                    .addTo(map)
                    .bindPopup('Default Location (Madurai)')
                    .openPopup();
                        
                    // Load workers near default location
                    console.log('Using default location:', defaultLat, defaultLng);
                    await findWorkers(defaultLat, defaultLng);
                }

            } catch (error) {
                console.error('Error initializing map:', error);
                document.getElementById('workerList').innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-circle"></i>
                        <p>Error loading map: ${error.message}</p>
                        <button onclick="window.location.reload()" class="btn btn-primary">
                            <i class="fas fa-redo"></i> Retry
                        </button>
                        <div class="debug-info">
                            <small>Debug info:</small>
                            <pre>${JSON.stringify({
                                url: window.location.href,
                                defaultLocation: [defaultLat, defaultLng],
                                error: error.toString()
                            }, null, 2)}</pre>
                        </div>
                    </div>`;
            }
        }



        function createWorkerCard(worker, userLat, userLng) {
            const distance = haversine(userLat, userLng, worker.location.y, worker.location.x);
            const card = document.createElement('div');
            card.className = 'worker-card';
            // Get worker name from email (remove @gmail.com)
            const workerName = worker.email.split('@')[0].charAt(0).toUpperCase() + worker.email.split('@')[0].slice(1);
            card.innerHTML = `
                <div class="worker-info">
                    <h4>${workerName}</h4>
                    <p class="worker-type"><i class="fas fa-tools"></i> ${worker.workerType.charAt(0).toUpperCase() + worker.workerType.slice(1)}</p>
                    <div class="rating">
                        <span class="stars">${'★'.repeat(Math.round(worker.averageRating))}</span>
                        <small>(${worker.ratingCount} reviews)</small>
                    </div>
                    <p><i class="fas fa-rupee-sign"></i> ${worker.charge}/hour</p>
                    <small><i class="fas fa-map-marker-alt"></i> ${Math.round(distance)}m away</small>
                </div>
                <button onclick="showServiceLocationForm('${worker.id}')" class="btn btn-primary">
                    <i class="fas fa-tools"></i> Request Service
                </button>
            `;
            return card;
        }

        function createWorkerPopup(worker, distance) {
            return `
                <div class="worker-popup">
                    <h4>${worker.workerType.charAt(0).toUpperCase() + worker.workerType.slice(1)}</h4>
                    <p>Rating: ${worker.averageRating.toFixed(1)} (${worker.ratingCount} reviews)</p>
                    <p>Charge: ₹${worker.charge}/hour</p>
                    <p>Distance: ${Math.round(distance)}m</p>
                    <button onclick="showServiceLocationForm('${worker.id}')" class="btn btn-primary btn-sm">
                        Request Service
                    </button>
                </div>
            `;
        }

        async function findWorkers(latitude, longitude) {
            try {
                // Use provided coordinates, stored location, or default to Madurai
                if (typeof latitude === 'undefined' || typeof longitude === 'undefined') {
                    const storedLoc = window.userLocation;
                    if (storedLoc) {
                        latitude = storedLoc.lat;
                        longitude = storedLoc.lng;
                    } else {
                        // Default to Madurai
                        latitude = 9.9252;
                        longitude = 78.1198;
                        window.userLocation = { lat: latitude, lng: longitude };
                    }
                }

                console.log('Finding workers near:', latitude, longitude);

                const workerType = document.getElementById('workerType').value.trim();
                const maxDistance = document.getElementById('maxDistance').value;
                const maxCharge = document.getElementById('maxCharge').value;

                // Update loading state with animation
                const list = document.getElementById('workerList');
                list.innerHTML = `
                    <div class="loading">
                        <i class="fas fa-circle-notch fa-spin"></i>
                        Finding workers near you...
                    </div>`;

                // Clear existing worker markers but keep user location marker
                map.eachLayer(layer => {
                    if (layer instanceof L.Marker && !layer._popup?._content?.includes('Location')) {
                        map.removeLayer(layer);
                    }
                });

                const baseUrl = window.location.port === '5500' ? 'http://localhost:8080' : '';
                const token = localStorage.getItem('hirehub_token');
                
                if (!token) {
                    throw new Error('Not authenticated. Please log in again.');
                }

                // First, let's add some sample workers if none exist
                try {
                    const response = await fetch(`${baseUrl}/api/customer/add-sample-workers`, {
                        method: 'POST'
                    });
                    console.log('Sample workers response:', await response.text());
                } catch (error) {
                    console.warn('Error adding sample workers:', error);
                }

                console.log('Fetching workers with params:', {
                    latitude,
                    longitude,
                    maxDistance,
                    workerType,
                    maxCharge
                });

                const response = await fetch(
                    `${baseUrl}/api/customer/nearby-workers?lat=${latitude}&lng=${longitude}&maxDistance=${maxDistance}&workerType=${workerType}&maxCharge=${maxCharge}`,
                    {
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        }
                    }
                );

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Server error:', response.status, errorText);
                    throw new Error(`Server error: ${response.status} - ${errorText}`);
                }

                const workers = await response.json();
                console.log('Received workers:', workers);
                list.innerHTML = '';

                if (!Array.isArray(workers) || workers.length === 0) {
                    console.log('No workers found');
                    list.innerHTML = `
                        <div class="no-results">
                            <i class="fas fa-search"></i>
                            <p>No workers found matching your criteria</p>
                            <small>Try adjusting your filters or increasing the search distance</small>
                        </div>`;
                    return;
                }

                // Sort workers by distance
                workers.sort((a, b) => {
                    const distA = haversine(latitude, longitude, a.location.y, a.location.x);
                    const distB = haversine(latitude, longitude, b.location.y, b.location.x);
                    return distA - distB;
                });

                console.log('Sorted workers:', workers);

                // Add markers and create worker cards
                const bounds = L.latLngBounds([[latitude, longitude]]);
                const workerMarkers = []; // Keep track of all worker markers
                
                workers.forEach(worker => {
                    const distance = haversine(latitude, longitude, worker.location.y, worker.location.x);
                    console.log('Adding worker to map:', {
                        id: worker.id,
                        type: worker.workerType,
                        location: [worker.location.y, worker.location.x],
                        distance: distance
                    });
                    
                    // Add worker marker with custom icon and tooltip
                    const marker = L.marker([worker.location.y, worker.location.x], {
                        icon: workerMarker,
                        title: `${worker.workerType} - ${Math.round(distance)}m away`
                    })
                    .addTo(map)
                    .bindPopup(createWorkerPopup(worker, distance))
                    .bindTooltip(worker.workerType.charAt(0).toUpperCase() + worker.workerType.slice(1), {
                        permanent: false,
                        direction: 'top'
                    });

                    // Add click handler to marker
                    marker.on('click', () => {
                        console.log('Worker marker clicked:', worker.id);
                        showServiceLocationForm(worker.id);
                    });
                    
                    workerMarkers.push(marker);
                    
                    // Create and append worker card with hover effect
                    const card = createWorkerCard(worker, latitude, longitude);
                    
                    // Add hover interactions between card and marker
                    card.addEventListener('mouseenter', () => {
                        marker.openTooltip();
                        card.style.transform = 'translateY(-4px)';
                        marker.setZIndexOffset(1000); // Bring to front
                    });
                    
                    card.addEventListener('mouseleave', () => {
                        marker.closeTooltip();
                        card.style.transform = 'translateY(0)';
                        marker.setZIndexOffset(0);
                    });
                    
                    // Add click handler to card
                    card.addEventListener('click', () => {
                        console.log('Worker card clicked:', worker.id);
                        map.setView([worker.location.y, worker.location.x], 15);
                        marker.openPopup();
                    });
                    
                    list.appendChild(card);
                    bounds.extend([worker.location.y, worker.location.x]);
                });

                // Add padding to bounds
                bounds.pad(0.2);

                // Fit map to show all markers
                if (workerMarkers.length > 0) {
                    console.log('Fitting map to bounds:', bounds);
                    map.fitBounds(bounds);
                    
                    // Create a radius circle around user location
                    L.circle([latitude, longitude], {
                        radius: maxDistance,
                        color: '#3388ff',
                        fillColor: '#3388ff',
                        fillOpacity: 0.1,
                        weight: 1
                    }).addTo(map);
                }

                // Fit map to show all markers with padding
                map.fitBounds(bounds, { 
                    padding: [50, 50],
                    maxZoom: 15 // Prevent excessive zoom
                });

                // Update status message
                const plural = workers.length === 1 ? '' : 's';
                list.insertAdjacentHTML('beforebegin', 
                    `<div class="results-summary">${workers.length} worker${plural} found</div>`
                );

            } catch (error) {
                console.error('Error finding workers:', error);
                const errorMessage = error.message.includes('Not authenticated') ?
                    'Please log in again to continue.' :
                    'Error loading workers. Please try again.';
                    
                document.getElementById('workerList').innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-circle"></i>
                        <p>${errorMessage}</p>
                        ${error.message.includes('Not authenticated') ? 
                            '<button onclick="window.location.href=\'/login-customer.html\'" class="btn btn-primary">Log In</button>' : 
                            '<button onclick="findWorkers()" class="btn btn-primary">Retry</button>'}
                    </div>`;
            }
        }

        let serviceMap, serviceMarker, selectedWorkerId;

        function showServiceLocationForm(workerId) {
            console.log('Opening service location form for worker:', workerId);
            selectedWorkerId = workerId;
            document.getElementById('backdrop').style.display = 'block';
            document.getElementById('locationForm').style.display = 'block';
            
            // Initialize service location map if not already initialized
            if (!serviceMap) {
                serviceMap = L.map('serviceMap').setView([0, 0], 2);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(serviceMap);
            }

            // Set view to user's current location or stored location
            const userLoc = window.userLocation || { lat: 9.9252, lng: 78.1198 }; // Default to Madurai
            console.log('Setting service map view to:', userLoc);
            
            // Ensure the map is visible before setting the view
            setTimeout(() => {
                serviceMap.invalidateSize();
                serviceMap.setView([userLoc.lat, userLoc.lng], 15);
                
                // Add or update marker
                if (serviceMarker) {
                    serviceMarker.setLatLng([userLoc.lat, userLoc.lng]);
                } else {
                    serviceMarker = L.marker([userLoc.lat, userLoc.lng], {
                        draggable: true,
                        icon: L.icon({
                            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
                            iconSize: [25, 41],
                            iconAnchor: [12, 41],
                            popupAnchor: [1, -34]
                        })
                    }).addTo(serviceMap);
                }

                // Update hidden inputs when marker is dragged
                serviceMarker.on('dragend', function(e) {
                    const pos = e.target.getLatLng();
                    document.getElementById('serviceLat').value = pos.lat;
                    document.getElementById('serviceLng').value = pos.lng;
                    console.log('Marker dragged to:', pos);
                });

                // Initialize hidden inputs with initial marker position
                document.getElementById('serviceLat').value = userLoc.lat;
                document.getElementById('serviceLng').value = userLoc.lng;

                // Click to move marker
                serviceMap.on('click', function(e) {
                    serviceMarker.setLatLng(e.latlng);
                    document.getElementById('serviceLat').value = e.latlng.lat;
                    document.getElementById('serviceLng').value = e.latlng.lng;
                    console.log('Marker moved to:', e.latlng);
                });

                // Add circle to show 1km radius
                L.circle([userLoc.lat, userLoc.lng], {
                    radius: 1000,
                    color: '#3388ff',
                    fillColor: '#3388ff',
                    fillOpacity: 0.1
                }).addTo(serviceMap);
            }, 100);
        }

        function hideServiceLocationForm() {
            document.getElementById('backdrop').style.display = 'none';
            document.getElementById('locationForm').style.display = 'none';
            document.getElementById('serviceType').value = '';
            // Reset form state
            selectedWorkerId = null;
            if (serviceMarker) {
                serviceMarker.remove();
                serviceMarker = null;
            }
        }

        async function confirmServiceRequest() {
            try {
                const lat = document.getElementById('serviceLat').value;
                const lng = document.getElementById('serviceLng').value;
                const serviceType = document.getElementById('serviceType').value.trim();
                const user = JSON.parse(localStorage.getItem('hirehub_user'));
                const token = localStorage.getItem('hirehub_token');

                // Validate all required data
                if (!serviceType) {
                    alert('Please enter a service type');
                    return;
                }

                if (!selectedWorkerId) {
                    alert('No worker selected. Please try again.');
                    return;
                }

                if (!user || !user.id) {
                    alert('Session expired. Please log in again.');
                    window.location.href = 'login-customer.html';
                    return;
                }

                if (!token) {
                    alert('Session expired. Please log in again.');
                    window.location.href = 'login-customer.html';
                    return;
                }

                if (!lat || !lng) {
                    alert('Please select a service location on the map');
                    return;
                }

                console.log('Sending service request:', {
                    workerId: selectedWorkerId,
                    location: [lng, lat],
                    serviceType: serviceType,
                    customerId: user.id
                });

                const data = {
                    customerId: user.id,
                    workerId: selectedWorkerId,
                    location: {x: parseFloat(lng), y: parseFloat(lat)}, // Point(lng, lat)
                    serviceType: serviceType,
                    status: 'pending'
                };

                const baseUrl = window.location.port === '5500' ? 'http://localhost:8080' : '';
                const response = await fetch(`${baseUrl}/api/customer/request-service`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem('hirehub_token')
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Request failed: ${errorText}`);
                }

                const result = await response.json();
                console.log('Service request created:', result);
                
                // Immediately hide the form
                hideServiceLocationForm();

                // Force an immediate refresh of the requests
                await loadRequests(true);
                
                // Show success message after UI is updated
                alert('Service request sent successfully!');
                
                // Schedule periodic updates
                scheduleRequestUpdates();
            } catch (error) {
                console.error('Error sending service request:', error);
                alert('Failed to send request: ' + error.message);
            }
        }

        let loadRequestsTimeout;
        let requestUpdateInProgress = false;
        async function loadRequests(force = false) {
            try {
                // Prevent multiple simultaneous updates
                if (requestUpdateInProgress && !force) {
                    console.log('Update already in progress, skipping...');
                    return;
                }

                requestUpdateInProgress = true;

                // Clear any pending timeout
                if (loadRequestsTimeout) {
                    clearTimeout(loadRequestsTimeout);
                }

                console.log('Loading service requests...');
                const baseUrl = window.location.port === '5500' ? 'http://localhost:8080' : '';
                const user = JSON.parse(localStorage.getItem('hirehub_user'));
                const token = localStorage.getItem('hirehub_token');
                
                if (!user || !user.id) {
                    console.error('No user ID found in localStorage');
                    document.getElementById('requestList').innerHTML = `
                        <div class="error-message">
                            <p>Please log in to view your requests</p>
                            <button onclick="window.location.href='login-customer.html'" class="btn btn-primary">
                                Log In
                            </button>
                        </div>`;
                    return;
                }

                if (!token) {
                    console.error('No auth token found');
                    document.getElementById('requestList').innerHTML = `
                        <div class="error-message">
                            <p>Session expired. Please log in again</p>
                            <button onclick="window.location.href='login-customer.html'" class="btn btn-primary">
                                Log In
                            </button>
                        </div>`;
                    return;
                }

                console.log('Fetching requests for user:', user.id);
                const response = await fetch(`${baseUrl}/api/customer/requests?userId=${user.id}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                        'Cache-Control': 'no-cache'
                    }
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Failed to load requests: ${response.status} - ${errorText}`);
                }

                const requests = await response.json();
                console.log('Received requests:', requests);

                const list = document.getElementById('requestList');
                list.innerHTML = ''; // Clear the list first

                if (!Array.isArray(requests)) {
                    console.error('Received invalid requests data:', requests);
                    list.innerHTML = `
                        <div class="error-message">
                            <i class="fas fa-exclamation-circle"></i>
                            <p>Error: Invalid response from server</p>
                            <button onclick="loadRequests()" class="btn btn-primary">
                                <i class="fas fa-redo"></i> Retry
                            </button>
                        </div>`;
                    return;
                }

                // Add the header
                list.innerHTML = '<h3><i class="fas fa-clipboard-list"></i> My Service Requests</h3>';

                if (requests.length === 0) {
                    list.innerHTML += `
                        <div class="no-requests">
                            <i class="fas fa-inbox"></i>
                            <p>No service requests yet</p>
                            <small>Your service requests will appear here</small>
                        </div>`;
                    return;
                }

                // Sort requests by creation date (newest first)
                requests.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

                // Sort requests by status priority and date
                const statusPriority = {
                    'pending': 0,
                    'accepted': 1,
                    'completed': 2,
                    'rejected': 3,
                    'cancelled': 4
                };

                requests.sort((a, b) => {
                    // First sort by status priority
                    const priorityDiff = statusPriority[a.status] - statusPriority[b.status];
                    if (priorityDiff !== 0) return priorityDiff;
                    // Then by date (newest first)
                    return new Date(b.createdAt) - new Date(a.createdAt);
                });

                requests.forEach(r => {
                    const div = document.createElement('div');
                    div.className = 'request-card';
                    
                    // Status badge color
                    const statusColors = {
                        'pending': '#ffc107',
                        'accepted': '#28a745',
                        'completed': '#17a2b8',
                        'rejected': '#dc3545',
                        'cancelled': '#6c757d'
                    };
                    
                    // Status icons
                    const statusIcons = {
                        'pending': 'clock',
                        'accepted': 'check-circle',
                        'completed': 'check-double',
                        'rejected': 'times-circle',
                        'cancelled': 'ban'
                    };

                    // Ensure we have valid status
                    const status = r.status || 'pending';
                    
                    div.innerHTML = `
                        <div class="request-info">
                            <h4>
                                <i class="fas fa-${statusIcons[r.status]}"></i>
                                ${r.serviceType.charAt(0).toUpperCase() + r.serviceType.slice(1)} Service
                            </h4>
                            <p class="status-badge" style="background:${statusColors[r.status]}">
                                ${r.status.toUpperCase()}
                            </p>
                            <div class="request-details">
                                <small><i class="fas fa-map-marker-alt"></i> Location: [${r.location.y.toFixed(6)}, ${r.location.x.toFixed(6)}]</small>
                                <small><i class="fas fa-clock"></i> Requested: ${new Date(r.createdAt).toLocaleString()}</small>
                            </div>
                        </div>
                        <div class="request-actions">`;
                    
                    if (r.status === 'accepted') {
                        div.innerHTML += `
                            <button onclick="completeRequest('${r.id}')" class="btn btn-primary">
                                <i class="fas fa-check"></i> Mark Complete
                            </button>`;
                    }
                    if (r.status === 'completed' && !r.rated) {
                        div.innerHTML += `
                            <button onclick="showRatingForm('${r.id}', '${r.workerId}')" class="btn btn-primary">
                                <i class="fas fa-star"></i> Rate Service
                            </button>`;
                    }
                    div.innerHTML += `</div>`;
                    list.appendChild(div);
                });

            } catch (error) {
                console.error('Error loading requests:', error);
                document.getElementById('requestList').innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-circle"></i>
                        <p>Error loading requests: ${error.message}</p>
                        <button onclick="loadRequests()" class="btn btn-primary">
                            <i class="fas fa-redo"></i> Retry
                        </button>
                    </div>`;
            }
        }

        async function completeRequest(requestId) {
            try {
                const user = JSON.parse(localStorage.getItem('hirehub_user'));
                if (!user || !user.id) {
                    window.location.href = 'login-customer.html';
                    return;
                }

                const baseUrl = window.location.port === '5500' ? 'http://localhost:8080' : '';
                const response = await fetch(`${baseUrl}/api/customer/complete-request?requestId=${requestId}&userId=${user.id}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + localStorage.getItem('hirehub_token'),
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (!response.ok) {
                    if (response.status === 401 || response.status === 403) {
                        // Token expired or invalid
                        window.location.href = 'login-customer.html';
                        return;
                    }
                    throw new Error(data.error || 'Failed to complete request');
                }

                // Show success message
                const notification = document.createElement('div');
                notification.className = 'notification success';
                notification.innerHTML = `
                    <i class="fas fa-check-circle"></i>
                    <span>${data.message || 'Service request completed successfully!'}</span>
                `;
                document.getElementById('notificationContainer').appendChild(notification);

                // Auto-hide after 5 seconds
                setTimeout(() => {
                    notification.remove();
                }, 5000);

                // Refresh the requests list
                await loadRequests(true);

                // Show rating form immediately
                showRatingForm(requestId);
            } catch (error) {
                console.error('Error completing request:', error);
                
                // Show error notification
                const notification = document.createElement('div');
                notification.className = 'notification error';
                notification.innerHTML = `
                    <i class="fas fa-exclamation-circle"></i>
                    <span>${error.message}</span>
                `;
                document.getElementById('notificationContainer').appendChild(notification);

                // Auto-hide after 5 seconds
                setTimeout(() => {
                    notification.remove();
                }, 5000);
            }
        }

        function showRatingForm(requestId, workerId) {
            currentRequestId = requestId;
            currentWorkerId = workerId;
            document.getElementById('ratingForm').style.display = 'block';
        }

        async function submitRating() {
            try {
                const user = JSON.parse(localStorage.getItem('hirehub_user'));
                const data = {
                    workerId: currentWorkerId,
                    customerId: user.id,
                    score: parseInt(document.getElementById('score').value),
                    comment: document.getElementById('comment').value
                };
                const baseUrl = window.location.port === '5500' ? 'http://localhost:8080' : '';
                const response = await fetch(`${baseUrl}/api/customer/rate-worker`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem('hirehub_token')
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Failed to submit rating: ${errorText}`);
                }

                alert('Rating submitted successfully!');
                document.getElementById('ratingForm').style.display = 'none';
                document.getElementById('backdrop').style.display = 'none';
                await loadRequests();
            } catch (error) {
                console.error('Error submitting rating:', error);
                alert('Failed to submit rating: ' + error.message);
            }
        }

        function scheduleRequestUpdates() {
            // Clear any existing interval
            if (window.requestUpdateInterval) {
                clearInterval(window.requestUpdateInterval);
            }
            // Set up new interval
            window.requestUpdateInterval = setInterval(() => loadRequests(), 5000);
        }

        async function checkSession() {
            const user = JSON.parse(localStorage.getItem('hirehub_user'));
            const token = localStorage.getItem('hirehub_token');
            
            if (!user || !token) {
                console.log('No valid session found, redirecting to login...');
                window.location.href = 'login-customer.html';
                return false;
            }
            return true;
        }

        // Initialize everything
        async function initialize() {
            if (await checkSession()) {
                await initMaps();
                await loadRequests(true);
                scheduleRequestUpdates();
                // Load workers after a short delay to ensure map is ready
                setTimeout(() => findWorkers(), 1000);
            }
        }

        // Start initialization
        initialize();
    </script>
</body>
</html>
